name: Final Automated Delivery Laboratory

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Customer name"
        required: true
        default: "Laura Bennett"
      dob:
        description: "Date of birth (YYYY-MM-DD)"
        required: true
        default: "1990-04-22"
      manuscript_number:
        description: "Manuscript number"
        required: true
        default: "9005"
      customer_email:
        description: "Customer email"
        required: false
        default: ""

jobs:
  automated-delivery-lab:
    runs-on: ubuntu-latest

    env:
      CUSTOMER_NAME: ${{ inputs.name }}
      CUSTOMER_DOB: ${{ inputs.dob }}
      MANUSCRIPT_NUMBER: ${{ inputs.manuscript_number }}
      CUSTOMER_EMAIL: ${{ inputs.customer_email }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Run engine and render personalized DOCX
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          from urllib.request import Request, urlopen

          import manuscript_builder

          customer_name = os.environ["CUSTOMER_NAME"]
          customer_dob = os.environ["CUSTOMER_DOB"]
          manuscript_number = os.environ["MANUSCRIPT_NUMBER"]

          print("=== FINAL AUTOMATED DELIVERY LABORATORY ===")
          print("Stage 1: Live engine")

          payload = json.dumps({
              "name": customer_name,
              "dob": customer_dob
          }).encode("utf-8")

          request = Request(
              "https://cipher-api-txyc.onrender.com/api/corridor-3-debug",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          engine_result = json.loads(
              urlopen(request, timeout=120).read().decode("utf-8")
          )

          numeric_name = engine_result.get("numeric_name")

          if numeric_name is None:
              raise ValueError(
                  "LAB FAILED: engine did not return a numeric name."
              )

          if len(engine_result.get("corridors", [])) != 3:
              raise ValueError(
                  "LAB FAILED: engine did not return exactly 3 corridors."
              )

          print("Live engine: PASSED")

          print("Stage 2: Engine QC")
          qc_result = manuscript_builder.validate_engine_result(engine_result)
          print(qc_result)
          print("Engine QC: PASSED")

          print("Stage 3: Personalized manuscript renderer")

          template_path = Path("_Numeromancy Manuscript.docx")
          docx_path = Path(
              f"Numeromancy_Final_Lab_{manuscript_number}.docx"
          )

          render_result = manuscript_builder.render_manuscript(
              template_path,
              docx_path,
              customer_name,
              customer_dob,
              manuscript_number,
              engine_result,
          )

          print(render_result)

          if not docx_path.is_file():
              raise FileNotFoundError(
                  f"LAB FAILED: personalized DOCX not found: {docx_path}"
              )

          print("Personalized DOCX: PASSED")
          PY

      - name: Convert personalized DOCX to PDF
        run: |
          mkdir -p pdf-output

          libreoffice \
            --headless \
            --convert-to pdf \
            --outdir pdf-output \
            "Numeromancy_Final_Lab_${MANUSCRIPT_NUMBER}.docx"

          test -f "pdf-output/Numeromancy_Final_Lab_${MANUSCRIPT_NUMBER}.pdf"

          echo "DOCX TO PDF CONVERSION: PASSED"

      - name: Verify 29-page manuscript PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from pypdf import PdfReader

          manuscript_number = os.environ["MANUSCRIPT_NUMBER"]

          pdf_path = Path(
              f"pdf-output/Numeromancy_Final_Lab_{manuscript_number}.pdf"
          )

          reader = PdfReader(pdf_path)
          page_count = len(reader.pages)

          print(f"Manuscript PDF: {pdf_path}")
          print(f"Page count: {page_count}")
          print("Expected page count: 29")

          if page_count != 29:
              raise ValueError(
                  f"LAB FAILED: expected 29 manuscript pages, got {page_count}."
              )

          print("29-PAGE MANUSCRIPT PDF QC: PASSED")
          PY

      - name: Build personalized cover
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          from urllib.request import Request, urlopen

          import cover_builder

          customer_name = os.environ["CUSTOMER_NAME"]
          customer_dob = os.environ["CUSTOMER_DOB"]
          manuscript_number = os.environ["MANUSCRIPT_NUMBER"]

          payload = json.dumps({
              "name": customer_name,
              "dob": customer_dob
          }).encode("utf-8")

          request = Request(
              "https://cipher-api-txyc.onrender.com/api/corridor-3-debug",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          engine_result = json.loads(
              urlopen(request, timeout=120).read().decode("utf-8")
          )

          numeric_name = engine_result["numeric_name"]

          cover_path = Path(
              f"Numeromancy_Final_Lab_Cover_{manuscript_number}.png"
          )

          cover_builder.build_cover(
              customer_name,
              numeric_name,
              manuscript_number,
              cover_path,
          )

          if not cover_path.is_file():
              raise FileNotFoundError(
                  f"LAB FAILED: cover not found: {cover_path}"
              )

          print(f"Cover: {cover_path}")
          print("COVER BUILDER: PASSED")
          PY

      - name: Assemble final 30-page PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import pdf_builder

          manuscript_number = os.environ["MANUSCRIPT_NUMBER"]

          cover_path = Path(
              f"Numeromancy_Final_Lab_Cover_{manuscript_number}.png"
          )

          manuscript_pdf = Path(
              f"pdf-output/Numeromancy_Final_Lab_{manuscript_number}.pdf"
          )

          final_pdf = Path(
              f"Numeromancy_Final_Automated_Delivery_Lab_{manuscript_number}.pdf"
          )

          result = pdf_builder.assemble_final_pdf(
              cover_path,
              manuscript_pdf,
              final_pdf,
          )

          print(result)

          if not final_pdf.is_file():
              raise FileNotFoundError(
                  f"LAB FAILED: final PDF not found: {final_pdf}"
              )

          print("PDF ASSEMBLY: PASSED")
          PY

      - name: Final 30-page delivery QC
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from pypdf import PdfReader

          manuscript_number = os.environ["MANUSCRIPT_NUMBER"]

          final_pdf = Path(
              f"Numeromancy_Final_Automated_Delivery_Lab_{manuscript_number}.pdf"
          )

          reader = PdfReader(final_pdf)
          page_count = len(reader.pages)

          print("=== FINAL DELIVERY QC ===")
          print(f"Final PDF: {final_pdf}")
          print(f"Page count: {page_count}")
          print("Expected page count: 30")

          if page_count != 30:
              raise ValueError(
                  f"LAB FAILED: expected 30 final pages, got {page_count}."
              )

          print("FINAL 30-PAGE PDF QC: PASSED")
          print("FINAL AUTOMATED-DELIVERY LAB TEST: PASSED")
          PY

      - name: Upload final automated-delivery PDF
        uses: actions/upload-artifact@v4
        with:
          name: Final-Automated-Delivery-Lab-${{ inputs.manuscript_number }}
          path: Numeromancy_Final_Automated_Delivery_Lab_${{ inputs.manuscript_number }}.pdf

      - name: Deliver final PDF to customer
        if: ${{ inputs.customer_email != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import json
          import os
          from urllib.request import Request, urlopen

          customer_name = os.environ["CUSTOMER_NAME"]
          customer_email = os.environ["CUSTOMER_EMAIL"]
          manuscript_number = os.environ["MANUSCRIPT_NUMBER"]

          final_pdf = Path(
              f"Numeromancy_Final_Automated_Delivery_Lab_{manuscript_number}.pdf"
          )

          payload = {
              "to": customer_email,
              "subject": f"Your Numeromancy Manuscript #{manuscript_number}",
              "body": (
                  f"Dear {customer_name},\n\n"
                  "Thank you for your purchase.\n\n"
                  "Your personalized 30-page Numeromancy manuscript is attached.\n\n"
                  "THE CIPHER CONTINUUM"
              ),
              "filename": f"Numeromancy_Manuscript_{manuscript_number}.pdf",
              "pdf_base64": base64.b64encode(
                  final_pdf.read_bytes()
              ).decode("ascii"),
          }

          request = Request(
              "https://script.google.com/macros/s/"
              "AKfycbypLBWYTuZFNBgSH7mH7S_m8THJU2QBxcMjX8zRVfJlDJT_O2x0Lw6lVGHf2OZ7n8T0/"
              "exec",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          response_text = urlopen(
              request,
              timeout=120
          ).read().decode("utf-8")

          print(f"Delivery service response: {response_text}")

          result = json.loads(response_text)

          if not result.get("ok"):
              raise ValueError(
                  "CUSTOMER DELIVERY FAILED: "
                  + str(result.get("error", "unknown error"))
              )

          print(
              f"CUSTOMER PDF DELIVERY: PASSED for {customer_email}"
          )
          PY

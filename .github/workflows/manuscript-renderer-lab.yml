name: Manuscript Renderer Laboratory

on:
  workflow_dispatch:

jobs:
  manuscript-renderer-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Manuscript Renderer components
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import manuscript_builder

          template = Path("_Numeromancy Manuscript.docx")

          if not template.is_file():
              raise FileNotFoundError(
                  f"Canonical manuscript template not found: {template}"
              )

          document = Document(template)

          print("=== MANUSCRIPT RENDERER LABORATORY ===")
          print(f"Template: {template}")
          print(f"Paragraph count: {len(document.paragraphs)}")
          print(f"Expected paragraph count: {manuscript_builder.EXPECTED_TEMPLATE_PARAGRAPHS}")

          if len(document.paragraphs) != manuscript_builder.EXPECTED_TEMPLATE_PARAGRAPHS:
              raise ValueError(
                  "LAB FAILED: canonical template paragraph count does not match renderer."
              )

          print("python-docx import: PASS")
          print("manuscript_builder import: PASS")
          print("canonical template found: PASS")
          print("template structure: PASS")
          print("MANUSCRIPT RENDERER COMPONENT CHECK: PASSED")
          PY

      - name: Run actual manuscript render test
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.request import Request, urlopen
          import manuscript_builder

          template = Path("_Numeromancy Manuscript.docx")

          print("=== ACTUAL MANUSCRIPT RENDER TEST ===")

          payload = json.dumps({
              "name": "Laura Bennett",
              "dob": "1990-04-22"
          }).encode("utf-8")

          request = Request(
              "https://cipher-api-txyc.onrender.com/api/corridor-3-debug",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          engine_result = json.loads(
              urlopen(request, timeout=120).read().decode("utf-8")
          )

          print(f"Live engine numeric name: {engine_result.get('numeric_name')}")
          print(f"Live engine corridors: {len(engine_result.get('corridors', []))}")

          if engine_result.get("numeric_name") != 159:
              raise ValueError(
                  f"LAB FAILED: expected Laura numeric name 159, received {engine_result.get('numeric_name')}"
              )

          if len(engine_result.get("corridors", [])) != 3:
              raise ValueError(
                  f"LAB FAILED: expected 3 corridors, received {len(engine_result.get('corridors', []))}"
              )

          output_path = Path("Numeromancy_Lab_Laura_Bennett_9003.docx")

          render_result = manuscript_builder.render_manuscript(
              template,
              output_path,
              "Laura Bennett",
              "1990-04-22",
              "9003",
              engine_result,
          )

          print(render_result)

          if not output_path.is_file():
              raise FileNotFoundError(
                  f"LAB FAILED: rendered manuscript was not created: {output_path}"
              )

          print(f"ACTUAL MANUSCRIPT RENDER: PASSED — {output_path}")
          PY

      - name: Upload rendered manuscript
        uses: actions/upload-artifact@v4
        with:
          name: Laura-Bennett-Manuscript-9003
          path: Numeromancy_Lab_Laura_Bennett_9003.docx

name: Cover Builder Laboratory

on:
  workflow_dispatch:

jobs:
  test-cover:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate long-name stress test cover
        run: |
          python - <<'PY'
          from cover_builder import build_cover

          result = build_cover(
              "Alexander Christopher Montgomery",
              159,
              9004,
              "Alexander_Montgomery_Cover_9004.png"
          )

          print(result)
          PY

      - name: Save test cover
        uses: actions/upload-artifact@v4
        with:
          name: Alexander-Montgomery-Cover-9004
          path: Alexander_Montgomery_Cover_9004.png
